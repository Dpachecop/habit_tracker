name: habit_tracker
description: "Personal habit tracker with customizable goals, streaks and reports."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.7.2

dependencies:
  cloud_firestore: ^6.8.0
  equatable: ^2.1.0
  firebase_auth: ^6.4.0
  firebase_core: ^4.13.0
  fl_chart: ^1.1.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  fpdart: ^1.2.0
  freezed_annotation: ^3.1.0
  go_router: ^17.0.0
  intl: ^0.19.0
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.5.4
  freezed: ^3.1.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.5
  firebase_auth_mocks: ^0.15.2

flutter:
  uses-material-design: true
  # Runs gen_l10n from l10n.yaml on pub get / run.
  generate: true

  # Inter, bundled rather than fetched at runtime: this app has to work with no
  # network. Three static weights instead of the variable file, because a
  # variable font in Flutter needs fontVariations at every call site and plain
  # fontWeight would silently do nothing. Licence in assets/fonts/OFL.txt.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
